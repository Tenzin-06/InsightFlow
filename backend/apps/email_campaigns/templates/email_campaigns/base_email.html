<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block title %}InsightFlow{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  </noscript>
  <![endif]-->
  <style>
    /* Reset */
    body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }

    /* Base */
    body { margin: 0; padding: 0; background-color: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .email-wrapper { width: 100%; background-color: #f4f5f7; padding: 32px 0; }
    .email-container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; }

    /* Header */
    .email-header { background-color: #18181b; padding: 24px 40px; text-align: center; }
    .email-header .logo { color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; text-decoration: none; }
    .email-header .logo span { color: #6366f1; }

    /* Body */
    .email-body { padding: 40px 40px 32px; }
    .email-body h1 { margin: 0 0 16px; font-size: 24px; font-weight: 700; color: #18181b; line-height: 1.3; }
    .email-body p { margin: 0 0 16px; font-size: 16px; line-height: 1.6; color: #52525b; }
    .email-body p:last-child { margin-bottom: 0; }

    /* CTA Button */
    .btn-wrapper { text-align: center; margin: 32px 0; }
    .btn { display: inline-block; background-color: #6366f1; color: #ffffff !important; font-size: 16px; font-weight: 600; text-decoration: none; padding: 14px 32px; border-radius: 6px; letter-spacing: 0.01em; }
    .btn:hover { background-color: #4f46e5; }

    /* Divider */
    .divider { border: none; border-top: 1px solid #e4e4e7; margin: 24px 0; }

    /* Footer */
    .email-footer { background-color: #f4f5f7; padding: 24px 40px; text-align: center; }
    .email-footer p { margin: 0; font-size: 13px; color: #a1a1aa; line-height: 1.5; }
    .email-footer a { color: #6366f1; text-decoration: none; }

    /* Link fallback */
    .link-fallback { margin: 16px 0; padding: 12px 16px; background-color: #f4f5f7; border-radius: 4px; word-break: break-all; }
    .link-fallback p { font-size: 13px; color: #71717a; margin: 0; }
    .link-fallback a { color: #6366f1; font-size: 13px; }

    /* Responsive */
    @media only screen and (max-width: 600px) {
      .email-wrapper { padding: 16px 0; }
      .email-body, .email-header, .email-footer { padding-left: 24px !important; padding-right: 24px !important; }
      .email-body h1 { font-size: 20px; }
      .btn { display: block; text-align: center; }
    }
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="email-wrapper">
    <tr>
      <td>
        <table role="presentation" class="email-container" cellpadding="0" cellspacing="0" align="center">
          <!-- Header -->
          <tr>
            <td class="email-header">
              <a href="#" class="logo">Insight<span>Flow</span></a>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="email-body">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="email-footer">
              <p>
                You received this email because you were invited to participate in a survey.<br />
                &copy; {% now "Y" %} InsightFlow. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
